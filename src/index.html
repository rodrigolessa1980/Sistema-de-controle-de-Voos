  return (

const paid = (c) => c.payments.reduce((s, p) => s + p.amount, 0);
const balance = (c) => Math.max(0, c.total - paid(c));
const chStatus = (c) => {
  const p = paid(c);
  if (p >= c.total && c.total > 0) return 'pago';
  const overdue = new Date(c.dueDate + 'T23:59:59').getTime() < TODAY.getTime();
  if (p > 0) return overdue ? 'vencido' : 'parcial';
  return overdue ? 'vencido' : 'pendente';
};
const clientBalance = (id, charges) => charges.filter(c => c.clientId === id).reduce((s, c) => s + balance(c), 0);
const clientFin = (id, charges) => {
  const mine = charges.filter(c => c.clientId === id);
  if (mine.some(c => chStatus(c) === 'vencido')) return 'vencido';
  if (mine.some(c => balance(c) > 0)) return 'pendente';
  return 'em_dia';
};
const clientTrips = (id, trips) => trips.filter(t => t.clientId === id && t.status !== 'recusada').length;

// Redimensiona a imagem enviada para caber no localStorage (JPEG comprimido).
function resizeImage(file, maxDim = 900, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w >= h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch (err) { resolve(e.target.result); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    <div className="space-y-3">

/* ============================================================
   CONFLITO DE HORÁRIOS
============================================================ */
function checkConflict(db, aircraftId, start, end, ignoreId) {
  const ns = new Date(start).getTime(), ne = new Date(end).getTime();
  if (isNaN(ns) || isNaN(ne)) return { conflict: false };
  const marginMs = (db.settings.marginMinutes || 0) * 60000;
  const busy = db.trips.filter(t => t.aircraftId === aircraftId && t.id !== ignoreId && t.status !== 'recusada' && t.status !== 'cancelada');
  for (const t of busy) {
    const es = new Date(t.departureAt).getTime(), ee = new Date(t.returnAt).getTime();
    // Sobreposição direta
    if (ns < ee && ne > es) return { conflict: true, label: `${t.code} · ${t.origin} → ${t.destination}` };
    // Intervalo mínimo entre voos (margem)
    if (marginMs > 0 && ns < ee + marginMs && ne > es - marginMs)
      return { conflict: true, margin: true, label: `${t.code} · intervalo mínimo de ${db.settings.marginMinutes} min entre voos` };
  }
  for (const b of db.blocks.filter(b => b.aircraftId === aircraftId))
    if (overlap(start, end, b.startAt, b.endAt)) return { conflict: true, label: (b.kind === 'manutencao' ? 'Manutenção · ' : 'Bloqueio · ') + b.reason };
  return { conflict: false };
}

/* ============================================================
   FORM: NOVA / EDITAR VIAGEM (Operacional)
============================================================ */
function TripForm({ open, onClose, editing, prefill }) {
  const { db, actions, notify, confirm } = useApp();
  const blank = { clientId: '', aircraftId: '', origin: '', destination: '', depDate: '', depTime: '', retDate: '', retTime: '', distance: '', passengers: '1', notes: '', commercial: '' };
  const [f, setF] = useState(blank);
  const [pax, setPax] = useState([]);
  useEffect(() => {
    if (!open) return;
    if (editing) { setF({ clientId: editing.clientId, aircraftId: editing.aircraftId || '', origin: editing.origin, destination: editing.destination, depDate: editing.departureAt.slice(0, 10), depTime: editing.departureAt.slice(11, 16), retDate: editing.returnAt.slice(0, 10), retTime: editing.returnAt.slice(11, 16), distance: editing.distanceKm ? String(editing.distanceKm) : '', passengers: String(editing.passengers), notes: editing.notes || '', commercial: editing.commercialValue ? String(editing.commercialValue) : '' }); setPax(editing.pax && editing.pax.length ? editing.pax : [newPax()]); }
    else if (prefill) { setF({ ...blank, ...prefill, commercial: '' }); setPax(prefill.pax && prefill.pax.length ? prefill.pax : [newPax()]); }
    else { setF(blank); setPax([newPax()]); }
  }, [open]);
  const set = (k, v) => setF(s => ({ ...s, [k]: v }));
  const start = combine(f.depDate, f.depTime), end = combine(f.retDate, f.retTime);
  const hasSched = f.depDate && f.depTime && f.retDate && f.retTime;
  const schedOk = hasSched && new Date(end).getTime() > new Date(start).getTime();
  const conflict = useMemo(() => (f.aircraftId && schedOk) ? checkConflict(db, f.aircraftId, start, end, editing && editing.id) : null, [f.aircraftId, start, end, schedOk]);
  const tariff = useMemo(() => db.tariffs.find(t => t.aircraftId === f.aircraftId && t.active), [f.aircraftId, db.tariffs]);
  const selAircraft = db.aircraft.find(a => a.id === f.aircraftId);
  const speed = selAircraft && selAircraft.cruiseSpeed ? selAircraft.cruiseSpeed : 0;
  const distance = Number(f.distance) || 0;
  // Horas de voo estimadas (ida + volta) a partir da distância do trecho e da velocidade de cruzeiro
  const hours = distance > 0 && speed > 0 ? Math.round((2 * distance / speed) * 10) / 10 : 0;
  const estimated = tariff && hours > 0 ? Math.round(tariff.value * hours) : 0;
  const paxOk = pax.length > 0 && pax.every(p => p.name.trim());
  const canSubmit = f.clientId && f.aircraftId && f.origin && f.destination && schedOk && paxOk && !(conflict && conflict.conflict);
  // Avaliação financeira do cliente que está sendo agendado
  const selClient = db.clients.find(c => c.id === f.clientId);
  const finStatus = f.clientId ? clientFin(f.clientId, db.charges) : 'em_dia';
  const finBalance = f.clientId ? clientBalance(f.clientId, db.charges) : 0;
  const hasPend = finStatus !== 'em_dia';
  const finalize = () => {
    const commercial = f.commercial ? Number(f.commercial) : estimated;
    const payload = { clientId: f.clientId, aircraftId: f.aircraftId, origin: f.origin, destination: f.destination, departureAt: start, returnAt: end, distanceKm: distance || undefined, passengers: pax.length > 0 ? pax.length : (Number(f.passengers) || 1), pax, notes: f.notes, internalTariff: tariff && tariff.value, estimatedValue: estimated, commercialValue: commercial };
    if (editing) { actions.updateTrip(editing.id, payload); notify('success', 'Viagem atualizada', `${editing.code} foi alterada.`); }
    else { const t = actions.addTrip({ ...payload, status: 'confirmada' }); notify('success', 'Viagem agendada', `${t.code} confirmada${hasPend ? ' (cliente com pendência)' : ''}.`); if (prefill && prefill.requestId) actions.setRequestStatus(prefill.requestId, 'convertida'); }
    onClose();
  };
  const submit = () => {
    if (!schedOk) return notify('error', 'Datas inválidas', 'A volta precisa ser depois da ida.');
    if (!editing && f.depDate < toISODate(TODAY)) return notify('error', 'Data no passado', 'A data de ida não pode ser anterior a hoje.');
    if (conflict && conflict.conflict) return notify('error', 'Voo NÃO disponível', 'A aeronave já tem compromisso neste período.');
    // O Operacional agenda direto; se houver pendência financeira, confirmar antes.
    if (hasPend) {
      return confirm({
        title: 'Cliente com pendência financeira',
        desc: `${selClient ? selClient.name : 'O cliente'} possui ${money(finBalance)} em aberto (situação: ${L.fin[finStatus]}). Deseja agendar a viagem mesmo assim?`,
        confirmLabel: 'Agendar mesmo assim',
        cancelLabel: 'Cancelar',
        danger: finStatus === 'vencido',
        onConfirm: finalize,
      });
    }
    finalize();
  };
  return (
    <Modal open={open} onClose={onClose} size="max-w-2xl" title={editing ? 'Editar viagem' : 'Nova viagem'}
      desc="O Operacional agenda direto. A aeronave e a tarifa são visíveis somente para o Operacional."
      footer={<><Btn variant="outline" onClick={onClose}>Cancelar</Btn><Btn onClick={submit} disabled={!canSubmit}><Icon name="Plane" size={16} />{editing ? 'Salvar alterações' : 'Agendar viagem'}</Btn></>}>
      <div className="grid gap-4 sm:grid-cols-2">
        <div className="sm:col-span-2"><Field label="Cliente" required help="Para quem é esta viagem.">
          <Select value={f.clientId} onChange={v => set('clientId', v)}><option value="">Selecione o cliente</option>{db.clients.map(c => <option key={c.id} value={c.id}>{c.name}{c.company ? ' · ' + c.company : ''}</option>)}</Select></Field></div>
        {f.clientId && hasPend && (
          <div className={`sm:col-span-2 flex items-start gap-3 rounded-lg border p-3.5 ${finStatus === 'vencido' ? 'border-danger/30 bg-danger-soft' : 'border-warning/30 bg-warning-soft'}`}>
            <span className={finStatus === 'vencido' ? 'text-danger' : 'text-warning'}><Icon name="AlertTriangle" size={20} /></span>
            <div className="flex-1">
              <p className={`text-sm font-semibold ${finStatus === 'vencido' ? 'text-danger' : 'text-[#9A6A10]'}`}>Cliente com pendência financeira</p>
              <p className="mt-0.5 text-sm text-sub">{selClient ? selClient.name : 'O cliente'} possui <strong>{money(finBalance)}</strong> em aberto · situação {L.fin[finStatus]}. Você pode agendar mesmo assim (será pedida uma confirmação).</p>
            </div>
            <FinBadge s={finStatus} />
          </div>
        )}
        {f.clientId && !hasPend && (
          <div className="sm:col-span-2 flex items-center gap-2 rounded-lg border border-success/30 bg-success-soft px-3 py-2 text-sm text-success"><Icon name="CheckCircle2" size={16} /> Cliente em dia com o financeiro.</div>
        )}
        <Field label="Origem" required help="De onde o voo parte."><Input value={f.origin} onChange={e => set('origin', e.target.value)} placeholder="Ex: São Paulo (CGH)" /></Field>

============================================================ */
function TariffForm({ open, onClose, editing }) {
  const { db, actions, notify } = useApp();
  const blank = { aircraftId: '', combustivel: '', horaVoo: '', taxas: '', despesaPiloto: '', unit: 'por_hora', startDate: '', endDate: '', active: true };
  const [f, setF] = useState(blank);
  useEffect(() => {
    if (!open) return;
    if (editing) {
      const c = editing.costs || {};
      // compatível com tarifas antigas: se não houver composição, joga o valor total em "hora de voo"
      const hasCosts = c.combustivel != null || c.horaVoo != null || c.taxas != null || c.despesaPiloto != null;
      setF({
        aircraftId: editing.aircraftId, unit: editing.unit, startDate: editing.startDate, endDate: editing.endDate || '', active: editing.active,
        combustivel: c.combustivel != null ? String(c.combustivel) : '',
        horaVoo: c.horaVoo != null ? String(c.horaVoo) : (hasCosts ? '' : (editing.value ? String(editing.value) : '')),
        taxas: c.taxas != null ? String(c.taxas) : '',
        despesaPiloto: c.despesaPiloto != null ? String(c.despesaPiloto) : '',
      });
    } else setF(blank);
  }, [open]);
  const set = (k, v) => setF(s => ({ ...s, [k]: v }));
  const total = COST_FIELDS.reduce((s, [k]) => s + (Number(f[k]) || 0), 0);
  const valid = f.aircraftId && total > 0 && f.startDate;
  const submit = () => {
    if (!valid) return notify('error', 'Campos obrigatórios', 'Selecione a aeronave, informe ao menos um valor e a data inicial.');
    const costs = { combustivel: Number(f.combustivel) || 0, horaVoo: Number(f.horaVoo) || 0, taxas: Number(f.taxas) || 0, despesaPiloto: Number(f.despesaPiloto) || 0 };
    const p = { aircraftId: f.aircraftId, value: total, costs, unit: f.unit, startDate: f.startDate, endDate: f.endDate || undefined, active: f.active };
    if (editing) { actions.updateTariff(editing.id, p); notify('success', 'Tarifa atualizada'); } else { actions.addTariff(p); notify('success', 'Tarifa criada'); }
    onClose();
  };
  const moneyInput = (k, label, help) => (
    <Field key={k} label={label} help={help}>
      <div className="relative"><span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-sub">R$</span>
        <Input type="number" min="0" value={f[k]} onChange={e => set(k, e.target.value)} className="pl-9" placeholder="0" /></div>
    </Field>
  );
  return (
    <Modal open={open} onClose={onClose} title={editing ? 'Editar tarifa' : 'Nova tarifa'} desc="Monte o valor da tarifa somando os custos. Uso interno."
      footer={<><Btn variant="outline" onClick={onClose}>Cancelar</Btn><Btn onClick={submit} disabled={!valid}>{editing ? 'Salvar' : 'Criar tarifa'}</Btn></>}>
      <div className="grid gap-4 sm:grid-cols-2">
        <div className="sm:col-span-2"><Field label="Aeronave" required help="Aeronave a que a tarifa se aplica."><Select value={f.aircraftId} onChange={v => set('aircraftId', v)}><option value="">Selecione</option>{db.aircraft.map(a => <option key={a.id} value={a.id}>{a.prefix} · {L.kind[a.kind]}</option>)}</Select></Field></div>
        <div className="sm:col-span-2">
          <p className="mb-1 text-xs font-semibold uppercase tracking-wide text-sub">Composição do custo</p>
          <div className="grid gap-4 sm:grid-cols-2">
            {COST_FIELDS.map(([k, label, help]) => moneyInput(k, label, help))}
          </div>
        </div>
        <div className="sm:col-span-2 flex items-center justify-between rounded-lg border border-primary/20 bg-primary-soft/50 p-3">
          <div><p className="text-sm font-medium text-primary-dark">Valor total da tarifa</p><p className="text-xs text-sub">Combustível + hora de voo + taxas e tarifas + despesa do piloto.</p></div>
          <p className="text-lg font-semibold text-primary">{money(total)}{f.unit === 'por_hora' ? '/h' : ''}</p>
        </div>
        <Field label="Tipo de cobrança" required help="Como é cobrado."><Select value={f.unit} onChange={v => set('unit', v)}>{Object.keys(L.unit).map(u => <option key={u} value={u}>{L.unit[u]}</option>)}</Select></Field>
        <Field label="Data inicial" required help="A partir de quando vale."><Input type="date" value={f.startDate} onChange={e => set('startDate', e.target.value)} /></Field>
        <Field label="Data final" help="Até quando vale (opcional)."><Input type="date" value={f.endDate} onChange={e => set('endDate', e.target.value)} /></Field>
        <div className="flex items-center justify-between rounded-lg border border-line p-3">
          <div><p className="text-sm font-medium">Tarifa ativa</p><p className="text-xs text-sub">Só tarifas ativas entram no cálculo.</p></div>
          <Toggle checked={f.active} onChange={v => set('active', v)} />
        </div>
      </div>
    </Modal>
  );
}
function Toggle({ checked, onChange }) {
  return <button type="button" onClick={() => onChange(!checked)} className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${checked ? 'bg-primary' : 'bg-slate-300'}`}><span className={`inline-block h-5 w-5 transform rounded-full bg-white shadow transition-transform ${checked ? 'translate-x-5' : 'translate-x-0.5'}`} /></button>;
}

function ClientDetail({ open, onClose, client, showAircraft }) {
  const { db } = useApp();
  const [tab, setTab] = useState('dados');
  useEffect(() => { if (open) setTab('dados'); }, [open]);
  if (!client) return null;
  const mine = db.trips.filter(t => t.clientId === client.id);
  const upcoming = mine.filter(t => isFuture(t.departureAt) && t.status !== 'recusada').sort((a, b) => new Date(a.departureAt) - new Date(b.departureAt));
  const history = mine.filter(t => !isFuture(t.departureAt) || t.status === 'concluida').sort((a, b) => new Date(b.departureAt) - new Date(a.departureAt));
  const myCharges = db.charges.filter(c => c.clientId === client.id);
  const acPrefix = (id) => { const a = db.aircraft.find(x => x.id === id); return a ? a.prefix : '—'; };
  const tabs = [['dados', 'Dados'], ['prox', 'Próximos'], ['hist', 'Histórico'], ['fin', 'Financeiro']];
  const tripRow = (t, when) => (
    <div key={t.id} className="flex items-center justify-between rounded-lg border border-line p-3">
      <div><p className="text-sm font-medium">{t.origin} → {t.destination}</p><p className="text-xs text-sub">{when}{showAircraft ? ' · ' + acPrefix(t.aircraftId) : ''}</p></div>
      <TripBadge s={t.status} />
    </div>
  );
  return (
    <Modal open={open} onClose={onClose} size="max-w-2xl">
      <div className="-mt-2 flex items-center gap-3">
        <Avatar name={client.name} size="h-12 w-12 text-sm" />
        <div><h3 className="text-lg font-semibold">{client.name}</h3><p className="text-sm text-sub">{client.company || 'Cliente pessoa física'}</p></div>
        <div className="ml-auto"><FinBadge s={clientFin(client.id, db.charges)} /></div>
      </div>
      <div className="mt-4 inline-flex w-full rounded-lg bg-soft p-1">
        {tabs.map(([k, lbl]) => <button key={k} onClick={() => setTab(k)} className={`flex-1 rounded-md px-3 py-1.5 text-sm font-medium ${tab === k ? 'bg-white shadow-card' : 'text-sub'}`}>{lbl}</button>)}
      </div>
      <div className="mt-4">
        {tab === 'dados' && (
          <div className="grid gap-3 sm:grid-cols-2">
            <DetailRow icon="Mail" label="E-mail" value={client.email} />
            <DetailRow icon="Phone" label="Telefone" value={client.phone || '—'} />
            <DetailRow icon="CreditCard" label="Documento" value={client.document || '—'} />
            <DetailRow icon="PlaneTakeoff" label="Total de viagens" value={String(clientTrips(client.id, db.trips))} />
          </div>
        )}
        {tab === 'prox' && (upcoming.length ? <div className="space-y-2">{upcoming.map(t => tripRow(t, fdatetime(t.departureAt)))}</div> : <Empty icon="PlaneTakeoff" title="Sem voos futuros" />)}
        {tab === 'hist' && (history.length ? <div className="space-y-2">{history.map(t => tripRow(t, fdate(t.departureAt)))}</div> : <Empty icon="Plane" title="Sem histórico" />)}
        {tab === 'fin' && (
          <div>
            <div className="mb-3 flex items-center justify-between rounded-lg bg-soft p-3"><span className="flex items-center gap-2 text-sm text-sub"><Icon name="Wallet" size={16} /> Saldo em aberto</span><span className="text-lg font-semibold">{money(clientBalance(client.id, db.charges))}</span></div>
            {myCharges.length ? <div className="space-y-2">{myCharges.map(c => (
              <div key={c.id} className="flex items-center justify-between rounded-lg border border-line p-3">
                <div><p className="text-sm font-medium">{c.code}</p><p className="text-xs text-sub">Vence {fdate(c.dueDate)}</p></div>
                <div className="text-right"><p className="text-sm font-semibold">{money(balance(c))}</p><PayBadge s={chStatus(c)} /></div>
              </div>))}</div> : <Empty icon="Wallet" title="Sem cobranças" />}
          </div>
        )}
      </div>
    </Modal>
  );
}
function DetailRow({ icon, label, value }) {
  return <div className="flex items-center gap-3 rounded-lg border border-line p-3"><div className="flex h-9 w-9 items-center justify-center rounded-lg bg-soft text-sub"><Icon name={icon} size={16} /></div><div className="min-w-0"><p className="text-xs text-sub">{label}</p><p className="truncate text-sm font-medium">{value}</p></div></div>;
}

  useEffect(() => {
    if (!open) return;
    if (presetChargeId) { const ch = db.charges.find(c => c.id === presetChargeId); setF({ clientId: ch ? ch.clientId : '', chargeId: presetChargeId, amount: ch ? String(balance(ch)) : '', date: '2026-08-11', method: 'pix', note: '' }); }
    else setF({ clientId: '', chargeId: '', amount: '', date: '2026-08-11', method: 'pix', note: '' });
  }, [open]);
  const set = (k, v) => setF(s => ({ ...s, [k]: v }));
  const clientCharges = db.charges.filter(c => c.clientId === f.clientId && balance(c) > 0);
  const ch = db.charges.find(c => c.id === f.chargeId);
  const bal = ch ? balance(ch) : 0;
  const amt = Number(f.amount) || 0;
  const remaining = Math.max(0, bal - amt);
  const valid = f.clientId && f.chargeId && amt > 0 && amt <= bal;
  const submit = () => {
    if (!valid) return notify('error', 'Verifique os dados', 'O valor deve ser maior que zero e não pode exceder o saldo.');
    actions.addPayment(f.chargeId, { amount: amt, date: f.date, method: f.method, note: f.note || undefined });
    if (remaining === 0) notify('success', 'Pagamento registrado', 'Cobrança quitada por completo.');
    else notify('success', 'Pagamento parcial registrado', 'Saldo restante: ' + money(remaining));
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose} title="Registrar pagamento" desc="Registre um pagamento total ou parcial de uma cobrança."
      footer={<><Btn variant="outline" onClick={onClose}>Cancelar</Btn><Btn onClick={submit} disabled={!valid}>Registrar pagamento</Btn></>}>
      <div className="grid gap-4">
        <div className="grid gap-4 sm:grid-cols-2">
          <Field label="Cliente" required help="Quem está pagando."><Select value={f.clientId} disabled={!!presetChargeId} onChange={v => { set('clientId', v); set('chargeId', ''); set('amount', ''); }}><option value="">Selecione</option>{db.clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</Select></Field>
          <Field label="Cobrança" required help="Cobrança que está sendo paga."><Select value={f.chargeId} disabled={!f.clientId || !!presetChargeId} onChange={v => { set('chargeId', v); const c = db.charges.find(x => x.id === v); if (c) set('amount', String(balance(c))); }}><option value="">Selecione</option>{clientCharges.map(c => <option key={c.id} value={c.id}>{c.code} · saldo {money(balance(c))}</option>)}</Select></Field>
        </div>
        {ch && <div className="grid grid-cols-3 gap-2 rounded-lg bg-soft p-3 text-center text-sm">
          <div><p className="text-xs text-sub">Total</p><p className="font-semibold">{money(ch.total)}</p></div>
          <div><p className="text-xs text-sub">Já pago</p><p className="font-semibold">{money(paid(ch))}</p></div>
          <div><p className="text-xs text-sub">Saldo</p><p className="font-semibold text-primary">{money(bal)}</p></div>
        </div>}
        <div className="grid gap-4 sm:grid-cols-2">
          <Field label="Valor recebido" required help="Quanto foi recebido agora.">
            <Input type="number" value={f.amount} onChange={e => set('amount', e.target.value)} placeholder="10000" />
            {ch && amt > bal && <p className="mt-1 text-xs text-danger">Não pode exceder {money(bal)}.</p>}
            {ch && amt > 0 && amt < bal && <p className="mt-1 text-xs text-sub">Parcial · saldo restante {money(remaining)}.</p>}
          </Field>
          <Field label="Data" required help="Data do recebimento."><Input type="date" value={f.date} onChange={e => set('date', e.target.value)} /></Field>
        </div>
        <Field label="Forma de pagamento" required help="Como o cliente pagou."><Select value={f.method} onChange={v => set('method', v)}>{Object.keys(L.method).map(m => <option key={m} value={m}>{L.method[m]}</option>)}</Select></Field>
        <Field label="Observação" help="Anotação opcional."><Textarea value={f.note} onChange={e => set('note', e.target.value)} placeholder="Ex: primeira parcela." /></Field>
      </div>
    </Modal>
  );
}

/* ============================================================
   CALENDÁRIO (mês / semana / dia)
============================================================ */
const WD = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const hhmm = (d) => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
function buildEvents(db, mask) {
  const cn = (id) => { const c = db.clients.find(x => x.id === id); return c ? c.name : 'Cliente'; };
  const pf = (id) => { const a = db.aircraft.find(x => x.id === id); return a ? a.prefix : '—'; };
  const te = db.trips.filter(t => t.status !== 'recusada' && t.status !== 'cancelada').map(t => ({ id: t.id, kind: 'trip', start: new Date(t.departureAt), end: new Date(t.returnAt), title: mask ? 'Ocupado' : t.origin + ' → ' + t.destination, client: mask ? null : cn(t.clientId), aircraft: mask ? null : pf(t.aircraftId), origin: t.origin, destination: t.destination, status: t.status }));
  const be = db.blocks.map(b => ({ id: b.id, kind: b.kind, start: new Date(b.startAt), end: new Date(b.endAt), title: mask ? 'Indisponível' : (b.kind === 'manutencao' ? 'Manutenção' : 'Bloqueio'), subtitle: mask ? null : b.reason, aircraft: mask ? null : pf(b.aircraftId) }));
  return [...te, ...be];
}
function eventsOnDay(events, day) {
  const target = new Date(day.getFullYear(), day.getMonth(), day.getDate());
  return events.filter(e => {
    const s = new Date(e.start.getFullYear(), e.start.getMonth(), e.start.getDate());
    const en = new Date(e.end.getFullYear(), e.end.getMonth(), e.end.getDate());
    return target >= s && target <= en;
  }).sort((a, b) => a.start - b.start);
}
const EV_CLS = { trip: 'bg-primary/10 text-primary border-primary/20', manutencao: 'bg-warning-soft text-[#9A6A10] border-warning/30', bloqueio: 'bg-slate-100 text-slate-600 border-slate-300' };
const EV_DOT = { trip: 'bg-primary', manutencao: 'bg-warning', bloqueio: 'bg-slate-400' };

function Calendar({ events, onEventClick, onDayClick }) {
  const [view, setView] = useState('mes');
  const [cursor, setCursor] = useState(TODAY);
  const move = (dir) => setCursor(c => view === 'mes' ? addMonths(c, dir) : addDays(c, view === 'semana' ? dir * 7 : dir));
  let title;
  if (view === 'mes') title = MONTHS[cursor.getMonth()] + ' de ' + cursor.getFullYear();
  else if (view === 'dia') title = WD[cursor.getDay()] + ', ' + cursor.getDate() + ' de ' + MONTHS[cursor.getMonth()];
  else { const s = addDays(cursor, -cursor.getDay()); const e = addDays(s, 6); title = `${s.getDate()}/${s.getMonth() + 1} – ${e.getDate()}/${e.getMonth() + 1}`; }

  // month grid
  const todayD = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const gridStart = addDays(first, -first.getDay());
  const monthDays = Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
  const weekStart = addDays(cursor, -cursor.getDay());
  const weekDays = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));

  return (
    <Card>
      <div className="flex flex-col gap-3 border-b border-line p-4 sm:flex-row sm:items-center">
        <div className="flex items-center gap-1">
          <Btn variant="outline" size="icon" onClick={() => move(-1)}><Icon name="ChevronLeft" size={16} /></Btn>
          <Btn variant="outline" size="icon" onClick={() => move(1)}><Icon name="ChevronRight" size={16} /></Btn>
          <Btn variant="ghost" size="sm" onClick={() => setCursor(TODAY)}>Hoje</Btn>
          <span className="ml-2 text-sm font-semibold capitalize">{title}</span>
        </div>
        <div className="sm:ml-auto"><div className="inline-flex rounded-lg bg-soft p-1">
          {[['mes', 'Mês'], ['semana', 'Semana'], ['dia', 'Dia']].map(([v, lbl]) => <button key={v} onClick={() => setView(v)} className={`rounded-md px-3 py-1.5 text-sm font-medium ${view === v ? 'bg-white shadow-card' : 'text-sub'}`}>{lbl}</button>)}
        </div></div>
      </div>

      {view === 'mes' && (
        <div>
          <div className="grid grid-cols-7 border-b border-line">{WD.map(w => <div key={w} className="px-2 py-2 text-center text-xs font-semibold uppercase text-sub">{w}</div>)}</div>
          <div className="grid grid-cols-7">
            {monthDays.map((day, i) => {
              const evs = eventsOnDay(events, day);
              const inMonth = day.getMonth() === cursor.getMonth();
              const today = sameDay(day.toISOString(), TODAY);
              const isPast = new Date(day.getFullYear(), day.getMonth(), day.getDate()) < todayD;
              const canPick = onDayClick && !isPast;
              return (
                <div key={i} onClick={() => canPick && onDayClick(day)} title={canPick ? 'Agendar viagem nesta data' : (isPast && onDayClick ? 'Data já passou' : undefined)}
                  className={`group min-h-[104px] border-b border-r border-line p-1.5 ${!inMonth ? 'bg-soft/40' : ''} ${isPast && inMonth ? 'bg-soft/30' : ''} ${i % 7 === 0 ? 'border-l' : ''} ${canPick ? 'cursor-pointer transition-colors hover:bg-primary-soft/40' : ''}`}>
                  <div className="mb-1 flex items-center justify-between">
                    {canPick ? <span className="opacity-0 transition-opacity group-hover:opacity-100 text-primary"><Icon name="Plus" size={14} /></span> : <span />}
                    <span className={`flex h-6 w-6 items-center justify-center rounded-full text-xs font-medium ${today ? 'bg-primary text-white' : inMonth ? '' : 'text-sub/50'}`}>{day.getDate()}</span>
                  </div>
                  <div className="space-y-1">
                    {evs.slice(0, 3).map(e => <button key={e.id} onClick={(ev) => { ev.stopPropagation(); onEventClick(e); }} className={`flex w-full items-center gap-1 truncate rounded border px-1.5 py-0.5 text-left text-[11px] ${EV_CLS[e.kind]}`}><span className="font-medium">{hhmm(e.start)}</span><span className="truncate">{e.aircraft ? e.aircraft + ' · ' : ''}{e.client || e.title}</span></button>)}
                    {evs.length > 3 && <span className="block px-1 text-[11px] text-sub">+{evs.length - 3} mais</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {view === 'semana' && (
        <div className="grid grid-cols-1 divide-y divide-line sm:grid-cols-7 sm:divide-x sm:divide-y-0">
          {weekDays.map((day, i) => {
            const evs = eventsOnDay(events, day);
            const today = sameDay(day.toISOString(), TODAY);
            return (
              <div key={i} className="min-h-[200px] p-2">
                <div className="mb-2 flex items-center justify-between"><span className="text-xs font-medium uppercase text-sub">{WD[day.getDay()]}</span><span className={`flex h-6 w-6 items-center justify-center rounded-full text-xs font-medium ${today ? 'bg-primary text-white' : ''}`}>{day.getDate()}</span></div>
                <div className="space-y-1.5">{evs.length ? evs.map(e => <button key={e.id} onClick={() => onEventClick(e)} className={`w-full rounded-md border p-1.5 text-left text-[11px] ${EV_CLS[e.kind]}`}><span className="block font-semibold">{hhmm(e.start)}</span><span className="block truncate">{e.client || e.title}</span></button>) : <p className="px-1 text-[11px] text-sub/50">—</p>}</div>
              </div>
            );
          })}
        </div>
      )}
      {view === 'dia' && (
        <div className="p-4">
          {eventsOnDay(events, cursor).length ? <div className="space-y-2">{eventsOnDay(events, cursor).map(e => (
            <button key={e.id} onClick={() => onEventClick(e)} className="flex w-full items-center gap-3 rounded-lg border border-line p-3 text-left hover:bg-soft/60">
              <span className={`h-2.5 w-2.5 rounded-full ${EV_DOT[e.kind]}`} /><span className="w-14 text-sm font-semibold">{hhmm(e.start)}</span>
              <div className="flex-1"><p className="text-sm font-medium">{e.client || e.title}</p><p className="text-xs text-sub">{e.origin ? e.origin + ' → ' + e.destination : (e.subtitle || '')}{e.aircraft ? ' · ' + e.aircraft : ''}</p></div>
            </button>))}</div> : <div className="py-12 text-center text-sm text-sub">Nenhum compromisso neste dia.</div>}
        </div>
      )}
      <div className="flex flex-wrap items-center gap-4 border-t border-line p-4 text-xs text-sub">
        <span className="inline-flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-primary" />Voo</span>
        <span className="inline-flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-warning" />Manutenção</span>
        <span className="inline-flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-slate-400" />Bloqueio</span>
      </div>
    </Card>
  );
}

            {sel.origin && <DR icon="MapPin" label="Trajeto" value={sel.origin + ' → ' + sel.destination} />}

function DR({ icon, label, value }) { return <div className="flex items-start gap-2.5">{icon && <span className="mt-0.5 text-sub"><Icon name={icon} size={16} /></span>}<div><p className="text-xs text-sub">{label}</p><p className="font-medium">{value}</p></div></div>; }

function FinRelatorios() {
  const { db } = useApp();

  const inad = db.clients.filter(c => clientBalance(c.id, db.charges) > 0).length;
  const monthly = useMemo(() => {
    const map = {};
    db.charges.forEach(c => c.payments.forEach(p => { const d = new Date(p.date); const k = d.getFullYear() * 12 + d.getMonth(); map[k] = (map[k] || 0) + p.amount; }));
    const abbr = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    return Object.keys(map).map(Number).sort((a, b) => a - b).map(k => ({ mes: abbr[k % 12], valor: map[k] }));
  }, [db]);
  const byStatus = useMemo(() => {
    const m = { pago: 0, parcial: 0, pendente: 0, vencido: 0 };
    db.charges.forEach(c => m[chStatus(c)]++);
    return Object.keys(m).filter(k => m[k] > 0).map(k => ({ name: k, value: m[k] }));

  const top = useMemo(() => db.clients.map(c => ({ name: c.name.split(' ')[0], saldo: clientBalance(c.id, db.charges) })).filter(c => c.saldo > 0).sort((a, b) => b.saldo - a.saldo).slice(0, 5), [db]);
  const maxMonthly = Math.max(1, ...monthly.map(m => m.valor));
  const maxTop = Math.max(1, ...top.map(t => t.saldo));
  const totalStatus = byStatus.reduce((s, x) => s + x.value, 0);

        <Card className="p-5">
          <h3 className="font-semibold">Recebimentos por mês</h3><p className="text-sm text-sub">Valores efetivamente recebidos</p>
          <div className="mt-6 flex h-52 items-end gap-6 border-b border-line pb-0">{monthly.map(m => (
            <div key={m.mes} className="flex flex-1 flex-col items-center gap-2">
              <span className="text-xs font-medium text-sub">{moneyShort(m.valor)}</span>
              <div className="w-full max-w-[64px] rounded-t-lg bg-primary" style={{ height: `${Math.max(6, (m.valor / maxMonthly) * 160)}px` }} />
              <span className="text-xs text-sub">{m.mes}</span>
            </div>
          ))}</div>
        </Card>
        <Card className="p-5">
          <h3 className="flex items-center gap-2 font-semibold"><Icon name="PieChart" size={16} className="text-sub" /> Cobranças por status</h3><p className="text-sm text-sub">Distribuição atual</p>
          <div className="mt-4 space-y-3">{byStatus.map(s => (
            <div key={s.name}>
              <div className="mb-1 flex items-center justify-between text-sm"><span className="capitalize">{L.pay[s.name]}</span><span className="font-medium">{s.value}</span></div>
              <div className="h-2.5 w-full overflow-hidden rounded-full bg-soft"><div className={`h-full rounded-full ${STCOL[s.name]}`} style={{ width: `${(s.value / totalStatus) * 100}%` }} /></div>
            </div>
          ))}</div>
        </Card>
        <Card className="p-5 lg:col-span-2">
          <h3 className="font-semibold">Maiores saldos em aberto</h3><p className="text-sm text-sub">Top 5 clientes por valor pendente</p>

            </div>
          ))}</div>
        </Card>
      </div>
    </div>
  );

/* ============================================================

============================================================ */
function CliSolicitar() {
  const { db, actions, notify, pendingDep, setPendingDep } = useApp();
  const id = db.currentClientId;
  const blank = { origin: '', destination: '', depDate: '', depTime: '', retDate: '', retTime: '', notes: '' };
  const [f, setF] = useState(() => pendingDep ? { ...blank, depDate: pendingDep } : blank);
  const [pax, setPax] = useState([newPax()]);
  const [sent, setSent] = useState(false);
  const [alertOpen, setAlertOpen] = useState(false);
  const pending = clientFin(id, db.charges) !== 'em_dia';
  // Data escolhida no calendário de Disponibilidade → preenche a Data de embarque uma vez.
  useEffect(() => { if (pendingDep) { setF(s => ({ ...s, depDate: pendingDep })); setPendingDep(null); } }, []);
  const set = (k, v) => setF(s => ({ ...s, [k]: v }));
  const routeOk = f.origin && f.destination && f.depDate && f.depTime && f.retDate && f.retTime;
  const paxOk = pax.length > 0 && pax.every(p => p.name.trim() && p.doc);
  const valid = routeOk && paxOk;
  const attempt = () => {
    if (!routeOk) return notify('error', 'Preencha os campos', 'Informe origem, destino e as datas de ida e volta.');
    if (f.depDate < toISODate(TODAY)) return notify('error', 'Data no passado', 'A data de embarque não pode ser anterior a hoje.');
    if (combine(f.retDate, f.retTime) <= combine(f.depDate, f.depTime)) return notify('error', 'Datas inválidas', 'A volta precisa ser depois da ida.');
    if (!paxOk) return notify('error', 'Complete os passageiros', 'Informe o nome e envie a foto do documento de cada passageiro.');
    if (pending) setAlertOpen(true); else doSubmit();
  };
  const doSubmit = () => { actions.addRequest({ clientId: id, origin: f.origin, destination: f.destination, departureAt: combine(f.depDate, f.depTime), returnAt: combine(f.retDate, f.retTime), passengers: pax.length, pax, notes: f.notes }); setAlertOpen(false); setSent(true); };
  if (sent) return (
    <div className="mx-auto max-w-2xl"><Card className="text-center">
      <div className="flex flex-col items-center py-12">
        <div className="flex h-16 w-16 items-center justify-center rounded-full bg-success-soft text-success"><Icon name="CheckCircle2" size={32} /></div>
        <h2 className="mt-5 text-xl font-semibold">Solicitação enviada com sucesso</h2>
        <p className="mt-2 max-w-sm text-sm text-sub">Recebemos o seu pedido e os documentos dos passageiros. Nossa equipe irá analisar a disponibilidade e retornar em breve.</p>
        <div className="mt-4"><Badge tone="warning" dot>Aguardando análise</Badge></div>
        <div className="mt-6"><Btn variant="outline" onClick={() => { setF(blank); setPax([newPax()]); setSent(false); }}>Nova solicitação</Btn></div>
      </div>
    </Card></div>
  );
  return (
    <div className="mx-auto max-w-5xl space-y-6">
      <PageHead title="Solicitar voo" desc="Preencha os dados da sua viagem. É rápido e simples." />
      <Card className="p-5">
        <h3 className="flex items-center gap-2 font-semibold"><Icon name="Plane" size={16} className="text-primary" /> Detalhes da viagem</h3><p className="text-sm text-sub">A nossa equipe escolhe a melhor aeronave para você.</p>
        <div className="mt-6 space-y-6">
          <div><p className="mb-3 text-sm font-semibold">Ida</p><div className="grid gap-4 sm:grid-cols-2">
            <Field label="Origem" required help="De onde você quer partir."><Input value={f.origin} onChange={e => set('origin', e.target.value)} placeholder="Ex: São Paulo (CGH)" /></Field>
            <Field label="Destino" required help="Para onde você quer ir."><Input value={f.destination} onChange={e => set('destination', e.target.value)} placeholder="Ex: Rio de Janeiro (SDU)" /></Field>
            <Field label="Data do embarque" required help="Dia da ida."><Input type="date" min={toISODate(TODAY)} value={f.depDate} onChange={e => set('depDate', e.target.value)} /></Field>
            <Field label="Hora do embarque" required help="Horário da ida."><Input type="time" value={f.depTime} onChange={e => set('depTime', e.target.value)} /></Field>
          </div></div>
          <div><p className="mb-3 text-sm font-semibold">Volta</p><div className="grid gap-4 sm:grid-cols-2">
            <Field label="Data da volta" required help="Dia do retorno."><Input type="date" min={f.depDate || toISODate(TODAY)} value={f.retDate} onChange={e => set('retDate', e.target.value)} /></Field>
            <Field label="Hora da volta" required help="Horário do retorno."><Input type="time" value={f.retTime} onChange={e => set('retTime', e.target.value)} /></Field>
          </div></div>
          <div>
            <div className="mb-1 flex items-center justify-between">
              <p className="text-sm font-semibold">Passageiros</p>
              <span className="text-xs text-sub">{pax.length} passageiro{pax.length > 1 ? 's' : ''}</span>
            </div>
            <p className="mb-3 text-xs text-sub">Informe o nome completo e a foto do documento com foto de cada passageiro (RG, CNH ou passaporte).</p>
            <PassengersEditor value={pax} onChange={setPax} />
          </div>
          <Field label="Observações" help="Alguma preferência ou informação importante?"><Textarea value={f.notes} onChange={e => set('notes', e.target.value)} placeholder="Ex: preciso retornar no mesmo dia..." /></Field>
          <div className="flex items-center gap-2 rounded-lg bg-primary-soft/60 p-3 text-xs text-primary-dark"><Icon name="Info" size={16} /> Você não escolhe a aeronave — nossa equipe seleciona a melhor opção e envia a viagem para o seu aceite.</div>
          <Btn size="lg" className="w-full" onClick={attempt}><Icon name="Send" size={16} /> Solicitar voo</Btn>
        </div>
      </Card>
      <Modal open={alertOpen} onClose={() => setAlertOpen(false)} size="max-w-md" footer={<><Btn variant="outline" onClick={() => setAlertOpen(false)}>Voltar</Btn><Btn onClick={doSubmit}>Continuar mesmo assim</Btn></>}>
        <div className="flex items-start gap-3"><div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-warning-soft text-warning"><Icon name="AlertTriangle" size={20} /></div>
          <div><h3 className="text-lg font-semibold">Atenção</h3><p className="mt-1.5 text-sm text-sub">Existem pagamentos pendentes em sua conta. Sua solicitação poderá depender da regularização financeira.</p></div></div>
      </Modal>
    </div>
  );
}

/* ============================================================
   CLIENTE — DISPONIBILIDADE (mascarada)
============================================================ */
function CliDisp() {
  const { db, go, setPendingDep } = useApp();
  const [cursor, setCursor] = useState(TODAY);
  const todayD = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  const pick = (day, st, inMonth, isPast) => { if (!inMonth || isPast || st !== 'disponivel') return; setPendingDep(toISODate(day)); go('cli-solicitar'); };
  const tripsActive = db.trips.filter(t => t.status !== 'recusada' && t.status !== 'cancelada');
  const coversRange = (startISO, endISO, d) => {
    const s0 = new Date(startISO), e0 = new Date(endISO);
    const s = new Date(s0.getFullYear(), s0.getMonth(), s0.getDate());
    const e = new Date(e0.getFullYear(), e0.getMonth(), e0.getDate());
    return d >= s && d <= e;
  };
  // Disponível se ao menos uma aeronave da frota estiver livre no dia (sem revelar detalhes).
  const dayStatus = (day) => {
    const d = new Date(day.getFullYear(), day.getMonth(), day.getDate());
    let free = 0, anyTrip = false;
    for (const a of db.aircraft) {
      const hasTrip = tripsActive.some(t => t.aircraftId === a.id && coversRange(t.departureAt, t.returnAt, d));
      const hasBlock = db.blocks.some(b => b.aircraftId === a.id && coversRange(b.startAt, b.endAt, d));
      if (hasTrip) anyTrip = true;
      if (!hasTrip && !hasBlock) free++;
    }
    if (free > 0) return 'disponivel';
    return anyTrip ? 'ocupado' : 'indisponivel';
  };
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const gridStart = addDays(first, -first.getDay());
  const days = Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
  const stCls = { disponivel: 'bg-success-soft text-success border-success/20', ocupado: 'bg-warning-soft text-[#9A6A10] border-warning/25', indisponivel: 'bg-slate-100 text-slate-500 border-slate-200' };
  const stLbl = { disponivel: 'Disponível', ocupado: 'Ocupado', indisponivel: 'Indisponível' };
  return (
    <div className="space-y-6">
      <PageHead title="Disponibilidade" desc="Veja os melhores dias para solicitar o seu voo."><Btn onClick={() => go('cli-solicitar')}>Solicitar voo</Btn></PageHead>
      <div className="flex items-center gap-2 rounded-lg border border-line bg-primary-soft/60 px-3 py-2 text-xs text-primary-dark"><Icon name="Info" size={14} /> Clique em um dia <strong>disponível</strong> para solicitar um voo já com a data de embarque preenchida.</div>
      <Card>
        <div className="flex items-center gap-2 border-b border-line p-4">
          <Btn variant="outline" size="icon" onClick={() => setCursor(c => addMonths(c, -1))}><Icon name="ChevronLeft" size={16} /></Btn>
          <Btn variant="outline" size="icon" onClick={() => setCursor(c => addMonths(c, 1))}><Icon name="ChevronRight" size={16} /></Btn>
          <Btn variant="ghost" size="sm" onClick={() => setCursor(TODAY)}>Hoje</Btn>
          <span className="ml-2 text-sm font-semibold capitalize">{MONTHS[cursor.getMonth()]} de {cursor.getFullYear()}</span>
        </div>
        <div className="p-4"><div className="grid grid-cols-7 gap-1.5">
          {WD.map(w => <div key={w} className="py-1 text-center text-xs font-semibold uppercase text-sub">{w}</div>)}
          {days.map((day, i) => { const st = dayStatus(day); const inMonth = day.getMonth() === cursor.getMonth(); const today = sameDay(day.toISOString(), TODAY); const isPast = new Date(day.getFullYear(), day.getMonth(), day.getDate()) < todayD; const clickable = inMonth && !isPast && st === 'disponivel'; return (
            <div key={i} onClick={() => pick(day, st, inMonth, isPast)} title={clickable ? 'Solicitar voo nesta data' : (isPast && inMonth ? 'Data já passou' : undefined)}
              className={`group relative flex min-h-[70px] flex-col rounded-lg border p-2 ${inMonth ? stCls[st] : 'border-transparent bg-soft/20 opacity-40'} ${isPast && inMonth ? 'opacity-45' : ''} ${clickable ? 'cursor-pointer ring-offset-1 transition-shadow hover:ring-2 hover:ring-success/50' : ''}`}>
              <span className={`text-xs font-semibold ${today ? 'flex h-5 w-5 items-center justify-center rounded-full bg-primary text-white' : ''}`}>{day.getDate()}</span>
              {inMonth && <span className="mt-auto text-[10px] font-medium">{isPast ? '—' : stLbl[st]}</span>}
              {clickable && <span className="pointer-events-none absolute right-1 top-1 opacity-0 transition-opacity group-hover:opacity-100"><Icon name="Plus" size={12} /></span>}
            </div>
          ); })}
        </div></div>
        <div className="flex flex-wrap items-center gap-4 border-t border-line p-4 text-xs text-sub">
          <span className="inline-flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-success" />Disponível</span>
          <span className="inline-flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-warning" />Ocupado</span>
          <span className="inline-flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-slate-400" />Indisponível</span>
        </div>
      </Card>
    </div>
  );
}

function CliViagens() {

  const upcoming = mine.filter(t => isFuture(t.departureAt) && t.status !== 'recusada' && t.status !== 'cancelada');

    <Card key={t.id}><div className="flex flex-col gap-3 p-4 sm:flex-row sm:items-center">

      {tab === 'hist' && (past.length ? <div className="grid gap-3">{past.map(row)}</div> : <Card><Empty icon="PlaneTakeoff" title="Sem histórico" /></Card>)}

  );

function CliFinanceiro() {
  const { db } = useApp();
  const id = db.currentClientId;

  const bal = clientBalance(id, db.charges);
  const totalPago = mine.reduce((s, c) => s + paid(c), 0);
  const vencido = mine.filter(c => chStatus(c) === 'vencido').reduce((s, c) => s + balance(c), 0);
  const tl = (tid) => { if (!tid) return null; const t = db.trips.find(x => x.id === tid); return t ? t.origin + ' → ' + t.destination : null; };
  return (
    <div className="space-y-6">
      <PageHead title="Financeiro" desc="Acompanhe seus pagamentos e valores em aberto." />

        <Stat label="Total pago" value={money(totalPago)} icon="CheckCircle2" tone="success" />
        <Stat label="Em atraso" value={money(vencido)} icon="ReceiptText" tone={vencido > 0 ? 'danger' : 'primary'} />
      </div>
      <Card>
        <div className="p-5 pb-3"><h3 className="font-semibold">Suas cobranças</h3><p className="text-sm text-sub">Detalhes de cada valor e seu status</p></div>
        <div className="space-y-3 px-5 pb-5">{mine.length === 0 ? <Empty icon="Wallet" title="Nenhuma cobrança" /> : mine.map(c => { const trip = tl(c.tripId); return (
          <div key={c.id} className="rounded-lg border border-line p-4">
            <div className="flex items-start justify-between gap-3"><div><p className="text-sm font-semibold">{c.code}</p>{trip && <p className="text-xs text-sub">{trip}</p>}<p className="mt-0.5 text-xs text-sub">Vencimento {fdate(c.dueDate)}</p></div><PayBadge s={chStatus(c)} /></div>

              <div><p className="text-xs text-sub">Total</p><p className="font-semibold">{money(c.total)}</p></div>
              <div><p className="text-xs text-sub">Pago</p><p className="font-semibold text-success">{money(paid(c))}</p></div>
              <div><p className="text-xs text-sub">Saldo</p><p className="font-semibold">{money(balance(c))}</p></div>
            </div>
            {c.payments.length > 0 && <div className="mt-3"><p className="mb-1.5 text-xs font-medium text-sub">Pagamentos realizados</p><div className="flex flex-wrap gap-2">{c.payments.map(p => <Badge key={p.id} tone="neutral">{fdate(p.date)} · {money(p.amount)} · {L.method[p.method]}</Badge>)}</div></div>}

        ); })}</div>
      </Card>
    </div>
  );
}

============================================================ */
const STORE_KEY = 'acm-html-v4';
function loadDb() { try { const raw = localStorage.getItem(STORE_KEY); if (raw) return { ...seed(), ...JSON.parse(raw) }; } catch (e) {} return seed(); }

function App() {
  const [db, setDb] = useState(loadDb);
  const [authed, setAuthed] = useState(false);
  const [page, setPage] = useState(HOME[db.role]);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [confirmState, setConfirmState] = useState(null);
  const [pendingDep, setPendingDep] = useState(null); // data pré-selecionada no calendário → Solicitar Voo
  const counters = useRef({ trip: 2050, req: 1190, charge: 3310 });

  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {} }, [db]);

  const notify = (type, title, desc) => {
    const id = uid('t-');
    setToasts(list => [...list, { id, type, title, desc }]);
    setTimeout(() => setToasts(list => list.filter(t => t.id !== id)), 3600);
  };
  const confirm = (opts) => setConfirmState(opts);
  const go = (p) => { setPage(p); setMobileOpen(false); };
  const setRole = (r) => { setDb(d => ({ ...d, role: r })); setPage(HOME[r]); setMobileOpen(false); };

  const actions = useMemo(() => ({
    addAircraft: (a) => setDb(d => ({ ...d, aircraft: [{ ...a, id: uid('ac-') }, ...d.aircraft] })),
    updateAircraft: (id, p) => setDb(d => ({ ...d, aircraft: d.aircraft.map(a => a.id === id ? { ...a, ...p } : a) })),
    removeAircraft: (id) => setDb(d => ({ ...d, aircraft: d.aircraft.filter(a => a.id !== id) })),
    addClient: (c) => setDb(d => ({ ...d, clients: [{ ...c, id: uid('cl-') }, ...d.clients] })),
    updateClient: (id, p) => setDb(d => ({ ...d, clients: d.clients.map(c => c.id === id ? { ...c, ...p } : c) })),
    addRequest: (r) => setDb(d => ({ ...d, requests: [{ ...r, id: uid('rq-'), code: 'SOL-' + (counters.current.req++), status: 'aguardando_analise' }, ...d.requests] })),
    setRequestStatus: (id, status) => setDb(d => ({ ...d, requests: d.requests.map(r => r.id === id ? { ...r, status } : r) })),
    addTrip: (t) => { const trip = { ...t, id: uid('tr-'), code: 'VOO-' + (counters.current.trip++) }; setDb(d => ({ ...d, trips: [trip, ...d.trips] })); return trip; },
    updateTrip: (id, p) => setDb(d => ({ ...d, trips: d.trips.map(t => t.id === id ? { ...t, ...p } : t) })),
    setTripStatus: (id, status) => setDb(d => ({ ...d, trips: d.trips.map(t => t.id === id ? { ...t, status } : t) })),
    addTariff: (t) => setDb(d => ({ ...d, tariffs: [{ ...t, id: uid('tf-') }, ...d.tariffs] })),
    updateTariff: (id, p) => setDb(d => ({ ...d, tariffs: d.tariffs.map(t => t.id === id ? { ...t, ...p } : t) })),
    addCharge: (c) => setDb(d => ({ ...d, charges: [{ ...c, id: uid('ch-'), code: 'COB-' + (counters.current.charge++), payments: [] }, ...d.charges] })),
    addPayment: (chargeId, p) => setDb(d => ({ ...d, charges: d.charges.map(c => c.id === chargeId ? { ...c, payments: [...c.payments, { ...p, id: uid('pay-') }] } : c) })),
    updateSettings: (p) => setDb(d => ({ ...d, settings: { ...d.settings, ...p } })),
    resetAll: () => { localStorage.removeItem(STORE_KEY); setDb(seed()); },
  }), []);

  const ctx = { db, actions, notify, confirm, go, setRole, page, pendingDep, setPendingDep };

  if (!authed) return (
    <AppCtx.Provider value={ctx}>
      <Login onEnter={() => { setPage(HOME[db.role]); setAuthed(true); }} />
      <Toasts list={toasts} />
    </AppCtx.Provider>
  );

  return (
    <AppCtx.Provider value={ctx}>
      <div className="flex min-h-screen bg-bg">
        <aside className="hidden w-64 shrink-0 border-r border-line bg-white lg:block"><div className="sticky top-0 h-screen"><SidebarInner /></div></aside>
        {/* Mobile drawer */}
        <div className={`fixed inset-0 z-50 lg:hidden ${mobileOpen ? '' : 'pointer-events-none'}`}>
          <div className={`absolute inset-0 bg-slate-900/40 backdrop-blur-[2px] transition-opacity ${mobileOpen ? 'opacity-100' : 'opacity-0'}`} onClick={() => setMobileOpen(false)} />
          <div className={`absolute left-0 top-0 h-full w-72 bg-white shadow-pop transition-transform duration-300 ${mobileOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <button onClick={() => setMobileOpen(false)} className="absolute right-3 top-4 rounded-md p-1 text-sub hover:bg-soft"><Icon name="X" size={20} /></button>
            <SidebarInner onNavigate={() => setMobileOpen(false)} />
          </div>
        </div>
        <div className="flex min-w-0 flex-1 flex-col">
          <Header onMenu={() => setMobileOpen(true)} onLogout={() => setAuthed(false)} />
          <main className="flex-1 px-4 py-5 sm:px-6 sm:py-6 lg:px-8 xl:px-10"><div className="w-full fade-in" key={page}>{renderPage(page)}</div></main>
        </div>
      </div>
      <Toasts list={toasts} />
      <ConfirmModal state={confirmState} onClose={() => setConfirmState(null)} />
      <GlobalDocViewer />
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
