# =============================================================================
#  nginx de BORDA — a peça que torna o deploy blue-green possível.
#
#  É o único container com porta pública (1700 e 1701). Ele não tem versão:
#  apenas repassa para a vaga ativa, `blue` ou `green`, lida de
#  `active-slot.conf` (gerado pelo docker/deploy.sh). Trocar de versão é
#  reescrever esse arquivo e dar `nginx -s reload` — o reload é gracioso: as
#  requisições em andamento terminam na vaga antiga, as novas vão para a nova,
#  e nenhuma conexão é derrubada.
#
#  Montado em /etc/nginx/conf.d/default.conf; o diretório com a vaga ativa é
#  montado em /etc/nginx/aircharter.
# =============================================================================

# Resolver do Docker: com o nome do upstream numa variável, o nginx resolve a
# cada requisição. Assim a borda sobe mesmo sem nenhuma vaga no ar, e nunca
# fica presa ao IP de um container que foi recriado.
resolver 127.0.0.11 valid=5s ipv6=off;

# ------------------------------------------------------------------- :1700 web
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Define `$slot` (blue | green).
    include /etc/nginx/aircharter/active-slot.conf;

    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A API direto, sem passar pelo nginx da vaga: um salto a menos.
    location /api/ {
        proxy_pass http://api-$slot:1701;

        # Upload de documento pode demorar mais que o padrão.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Estáticos, SPA, /health e /version.json: o nginx da vaga já define o cache
    # certo para cada um, e a borda não mexe nos cabeçalhos.
    location / {
        proxy_pass http://web-$slot:80;
        proxy_connect_timeout 5s;
    }
}

# ------------------------------------------------------------------- :1701 api
# Porta da API exposta como antes (API_BASE_URL e verificações do deploy).
server {
    listen 1701;
    server_name _;
    server_tokens off;

    include /etc/nginx/aircharter/active-slot.conf;

    client_max_body_size 8m;

    location / {
        proxy_pass http://api-$slot:1701;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
